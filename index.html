<body class="font-body bg-brand-dark text-white antialiased">
  <div id="root"></div>
  <script>
    // Manual Babel bootstrap: forces the classic React.createElement runtime
    // (the automatic runtime emits `import` statements babel-standalone can't
    // resolve when injecting a classic <script>, which breaks with no build step).
    async function loadJsx(url) {
      const res = await fetch(url);
      const code = await res.text();
      const out = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
      const s = document.createElement("script");
      s.text = out;
      document.body.appendChild(s);
    }
    (async () => {
      await loadJsx("clients-data.js");
      await loadJsx("app.jsx");
    })();
  </script>
